<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>A.i.Atik</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
  <h1 class="title tiny5-regular">Hello A.i.Atik!</h1>
  <div class="chicky">
    <div class="head">
      <div class="cube hair">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube top">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube top-middle">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube main">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube bottom">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube left wing base">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube left wing">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube right wing base">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube right wing">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube tail base">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube tail">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube top beak">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
      <div class="cube bottom beak">
        <div class="front"></div>
        <div class="rear"></div>
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="left"></div>
        <div class="right"></div>
      </div>
    </div>
    <div class="feet">
      <div class="left foot-group">
        <div class="cube left leg">
          <div class="front"></div>
          <div class="rear"></div>
          <div class="top"></div>
          <div class="bottom"></div>
          <div class="left"></div>
          <div class="right"></div>
        </div>
        <div class="cube left foot">
          <div class="front"></div>
          <div class="rear"></div>
          <div class="top"></div>
          <div class="bottom"></div>
          <div class="left"></div>
          <div class="right"></div>
        </div>
      </div>
      <div class="right foot-group">
        <div class="cube right leg">
          <div class="front"></div>
          <div class="rear"></div>
          <div class="top"></div>
          <div class="bottom"></div>
          <div class="left"></div>
          <div class="right"></div>
        </div>
        <div class="cube right foot">
          <div class="front"></div>
          <div class="rear"></div>
          <div class="top"></div>
          <div class="bottom"></div>
          <div class="left"></div>
          <div class="right"></div>
        </div>
      </div>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
